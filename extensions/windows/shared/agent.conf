<agent_config>

  <localfile>
    <location>Microsoft-Windows-Sysmon/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <localfile>
    <location>Microsoft-Windows-PowerShell/Operational</location>
    <log_format>eventchannel</log_format>
  </localfile>

  <syscheck>
    <directories check_all="yes" realtime="yes" report_changes="yes">C:\Sensitive</directories>
  </syscheck>

</agent_config>
